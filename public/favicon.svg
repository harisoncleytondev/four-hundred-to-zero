<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" fill="none">
  <defs>
    <!-- Gradiente do '4' dourado/âmbar -->
    <linearGradient id="num4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE68A" />
      <stop offset="60%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#B45309" />
    </linearGradient>
    
    <!-- Gradiente do '0' (pergaminho/off-white histórico) -->
    <linearGradient id="num0Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#D8D4CC" />
    </linearGradient>
  </defs>

  <!-- O '4' imponente à esquerda -->
  <text 
    x="38" 
    y="60" 
    font-family="'Cinzel', 'Playfair Display', Georgia, serif" 
    font-size="62" 
    font-weight="900" 
    fill="url(#num4Grad)" 
    text-anchor="middle"
    letter-spacing="-1"
  >
    4
  </text>

  <!-- O 'X' / 'A' editorial central (Quatrocentos "A" Zero) -->
  <text 
    x="80" 
    y="46" 
    font-family="'Space Grotesk', monospace" 
    font-size="14" 
    font-weight="700" 
    fill="#D97706" 
    fill-opacity="0.75" 
    letter-spacing="3" 
    text-anchor="middle"
  >
    A
  </text>

  <!-- O '0' lapidar com a fratura horizontal sutil cortando o meio -->
  <g>
    <text 
      x="122" 
      y="60" 
      font-family="'Cinzel', 'Playfair Display', Georgia, serif" 
      font-size="62" 
      font-weight="900" 
      fill="url(#num0Grad)" 
      text-anchor="middle"
      letter-spacing="-1"
    >
      0
    </text>

    <!-- Linha horizontal vermelha/rubi que cruza o '0' mostrando a quebra -->
    <line 
      x1="102" 
      y1="42" 
      x2="142" 
      y2="42" 
      stroke="#E11D48" 
      stroke-width="3" 
      stroke-linecap="round" 
    />
  </g>

  <!-- Linha de base minimalista e refinada -->
  <line x1="20" y1="72" x2="140" y2="72" stroke="#F5F2EB" stroke-opacity="0.15" stroke-width="1" />
  <circle cx="80" cy="72" r="2" fill="#D97706" />
</svg>
