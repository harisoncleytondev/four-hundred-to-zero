<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="indigoGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E1010" />
      <stop offset="50%" stop-color="#141838" />
      <stop offset="100%" stop-color="#062836" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97706" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="92" height="92" x="4" y="4" rx="24" fill="url(#indigoGradient)" stroke="#F5F2EB" stroke-opacity="0.2" stroke-width="2" />
  
  <!-- Intertwined Memorial Threads (Fios da Memória) -->
  <path d="M26 74 C 26 44, 42 26, 74 26" fill="none" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <path d="M26 50 C 44 50, 50 44, 74 44" fill="none" stroke="#F5F2EB" stroke-opacity="0.75" stroke-width="4" stroke-linecap="round" />
  <path d="M40 74 C 40 56, 56 40, 74 62" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6" />

  <!-- Nodes / Historical Points -->
  <circle cx="26" cy="74" r="5" fill="#F59E0B" />
  <circle cx="74" cy="26" r="5" fill="#F59E0B" />
  <circle cx="50" cy="50" r="3.5" fill="#F5F2EB" />
</svg>
